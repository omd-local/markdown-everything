name: Build independent macOS engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "omd/**"
      - "packaging/macos/**"
      - "tests/test_macos_bundle.py"
      - "docs/macos-engine.md"
      - ".github/workflows/macos-engine.yml"

permissions:
  contents: read

jobs:
  engine:
    name: Native ${{ matrix.architecture }} engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET_ARCH: ${{ matrix.architecture }}
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check native target and packaging regressions
        run: |
          python3 -c 'import os, platform; assert platform.machine() == os.environ["TARGET_ARCH"]'
          python3 -m pip install --no-cache-dir -e '.[test]'
          python3 -m pytest -q tests/test_macos_bundle.py
      - name: Download and verify the pinned standalone interpreter
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          import urllib.request
          path = Path("packaging/macos/build_bundle.py")
          spec = importlib.util.spec_from_file_location("builder", path)
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          root = Path(os.environ["RUNNER_TEMP"])
          record = builder.load_runtime_manifest()["runtimes"][os.environ["TARGET_ARCH"]]
          archive = root / record["filename"]
          urllib.request.urlretrieve(record["url"], archive)
          builder.verify_sha256(archive, record["sha256"])
          builder.extract_runtime(archive, root / "build-python")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RUNTIME_ARCHIVE={archive}\n")
          PY
      - name: Download only the checked-in, hash-locked document wheels
        run: |
          "$RUNNER_TEMP/build-python/bin/python3" -s -B -m pip --isolated --no-cache-dir download \
            --index-url https://pypi.org/simple --require-hashes --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/wheelhouse" \
            -r "packaging/macos/wheels-$TARGET_ARCH.requirements.txt"
      - name: Build and smoke-test the independent engine
        run: |
          python3 packaging/macos/build_bundle.py \
            --runtime-archive "$RUNTIME_ARCHIVE" --architecture "$TARGET_ARCH" \
            --profile documents --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --wheel-lock "packaging/macos/wheels-$TARGET_ARCH.lock.json" \
            --revision "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/engine-build"
      - name: Verify relocation and create the optional CLI installer
        run: |
          mv "$RUNNER_TEMP/engine-build" "$RUNNER_TEMP/engine relocated with spaces"
          app="$RUNNER_TEMP/engine relocated with spaces/OMD Engine.app"
          mkdir -p "$RUNNER_TEMP/empty-home"
          env -i HOME="$RUNNER_TEMP/empty-home" PATH=/usr/bin:/bin \
            "$app/Contents/MacOS/omd" --version
          env -i HOME="$RUNNER_TEMP/empty-home" PATH=/usr/bin:/bin \
            "$app/Contents/MacOS/omd" capabilities --json
          printf '<h1>Relocated document smoke</h1><p>Independent runtime.</p>' > "$RUNNER_TEMP/relocated.html"
          env -i HOME="$RUNNER_TEMP/empty-home" PATH=/usr/bin:/bin \
            "$app/Contents/MacOS/omd" "$RUNNER_TEMP/relocated.html" -o "$RUNNER_TEMP/relocated.md"
          mkdir "$RUNNER_TEMP/cli-alias"
          ln -s "$app/Contents/MacOS/omd" "$RUNNER_TEMP/cli-alias/omd"
          env -i HOME="$RUNNER_TEMP/empty-home" PATH=/usr/bin:/bin \
            "$RUNNER_TEMP/cli-alias/omd" "$RUNNER_TEMP/relocated.html" -o "$RUNNER_TEMP/alias.md"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for filename in ("relocated.md", "alias.md"):
              assert "Relocated document smoke" in (root / filename).read_text()
          PY
          python3 packaging/macos/build_pkg.py --app "$app" \
            --output "$RUNNER_TEMP/OMD-Engine-$TARGET_ARCH.pkg"
          /usr/sbin/pkgutil --expand-full "$RUNNER_TEMP/OMD-Engine-$TARGET_ARCH.pkg" "$RUNNER_TEMP/expanded"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          expanded = Path(os.environ["RUNNER_TEMP"]) / "expanded"
          info = ElementTree.parse(expanded / "PackageInfo").getroot()
          assert info.get("relocatable") == "false", "Installer must disable bundle relocation"
          relocation = info.find("relocate")
          assert relocation is None or len(relocation) == 0, "Installer must not contain relocation entries"
          assert info.find("./strict-identifier/bundle[@id='org.omd-local.engine']") is not None
          bundle = info.find("./bundle[@id='org.omd-local.engine']")
          assert bundle is not None and bundle.get("path") == "./Applications/OMD Engine.app"
          assert (expanded / "Payload/Applications/OMD Engine.app/Contents/MacOS/omd").is_file()
          assert (expanded / "Payload/usr/local/bin/omd").is_symlink()
          assert (expanded / "Scripts/preinstall").is_file()
          PY
          /usr/bin/ditto -c -k --keepParent --norsrc --noextattr \
            "$app" "$RUNNER_TEMP/OMD-Engine-$TARGET_ARCH.zip"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "OMD-Engine-$TARGET_ARCH.pkg" \
              "OMD-Engine-$TARGET_ARCH.zip" > "SHA256SUMS-$TARGET_ARCH.txt"
          )
      - name: Upload unsigned review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omd-engine-unsigned-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/OMD-Engine-${{ matrix.architecture }}.pkg
            ${{ runner.temp }}/OMD-Engine-${{ matrix.architecture }}.zip
            ${{ runner.temp }}/SHA256SUMS-${{ matrix.architecture }}.txt
            ${{ runner.temp }}/engine relocated with spaces/bundle-manifest.json
            packaging/macos/runtime-manifest.json
            packaging/macos/wheels-${{ matrix.architecture }}.lock.json
          if-no-files-found: error
          retention-days: 14
