name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disclosure-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Hosted AI disclosure review freshness
        run: python -m omd.provider_disclosure

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" setuptools wheel
          python -m pip install -e ".[ui,test]"
          python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)\._' omd tests

  wheel:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade "pip==26.2.1" setuptools wheel
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test installed entrypoints
        run: |
          python -m venv "$RUNNER_TEMP/omd-wheel"
          "$RUNNER_TEMP/omd-wheel/bin/python" -m pip install --upgrade "pip==26.2.1"
          "$RUNNER_TEMP/omd-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/omd-wheel/bin/omd" --help >/dev/null
          "$RUNNER_TEMP/omd-wheel/bin/omd-mcp" </dev/null

  dependency-audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit resolved local UI environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" setuptools wheel
          python -m pip install -e ".[ui,audit]"
          python -m pip check
          python -m pip_audit --local --progress-spinner off
      - name: Audit hosted demo requirements
        run: python -m pip_audit -r demo/huggingface-space/requirements.txt --progress-spinner off
