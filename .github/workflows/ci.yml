name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disclosure-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Hosted AI disclosure review freshness
        run: python -m omd.provider_disclosure

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Install optional image metadata support
        if: matrix.python-version != '3.10'
        run: python -m pip install "pillow>=13.0.0,<14"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)\._' omd tests

  wheel:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade "pip==26.2.1" setuptools wheel
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test installed entrypoints
        run: |
          python -m venv "$RUNNER_TEMP/omd-wheel"
          "$RUNNER_TEMP/omd-wheel/bin/python" -m pip install --upgrade "pip==26.2.1"
          "$RUNNER_TEMP/omd-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/omd-wheel/bin/omd" --version
          "$RUNNER_TEMP/omd-wheel/bin/omd" capabilities --json
          env -u OMD_BUILD_REVISION "$RUNNER_TEMP/omd-wheel/bin/python" -I -c 'import importlib.util; from omd.capabilities import capabilities_payload; p = capabilities_payload(); assert p["build_revision"] == __import__("os").environ["GITHUB_SHA"]; assert p["browser_ui"]["supported"] is False; assert importlib.util.find_spec("gradio") is None'
          "$RUNNER_TEMP/omd-wheel/bin/omd-ui" --help
          "$RUNNER_TEMP/omd-wheel/bin/omd" --help >/dev/null
          "$RUNNER_TEMP/omd-wheel/bin/omd-mcp" </dev/null

  dependency-audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit core and Homebrew conversion dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1" setuptools wheel
          python -m pip install -e ".[audit]" "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.6,<0.2" "pillow>=13.0.0,<14"
          python -c 'import importlib.util; assert importlib.util.find_spec("gradio") is None'
          python -m pip check
          python -m pip_audit --local --progress-spinner off
